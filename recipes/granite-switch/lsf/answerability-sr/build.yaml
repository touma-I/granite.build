######
# answerability-sr — train and evaluate a Shadow Residual (SR) answerability
# adapter on BlueVela.
#
# Two targets, wired by one artifact:
#
#   train ──(adapter)──> eval
#
# `train` runs `sr-train` against a config generated by train.sh beside this
# file; `eval` binds the adapter it produced and scores it with the same
# package's answerability evaluator, which rebuilds the SR base and attaches the
# adapter through stock PEFT. Both targets bind the SAME base-model artifact —
# they must, or the adapter is served on a different graph than it was trained
# on, and that is the one error nothing in the output would reveal.
#
# Nothing here names a filesystem path. The data and the base model are pulled
# from the Hub by granite.build and handed to the steps as local directories;
# the code is cloned from this repo and shadow-residual is installed from PyPI
# at a pinned ref.
#
# Values come from parameters.yaml beside this file; the comments explaining WHY
# each value is what it is live there.
#
# Run (parameters.yaml is picked up automatically because it sits next to this
# file):
#   gb build start -f recipes/granite-switch/lsf/answerability-sr/build.yaml \
#     --space <your-space>
######
granite.build:
  name: answerability-sr
  targets:

    ##########################################################################
    # train — SR adapter on the answerability task
    ##########################################################################
    train:
      environment_uri: "$${ENVIRONMENT_URI}"
      inputs:
        # DATA_URI names the dataset REPO, not the directory inside it. The
        # pull materializes the whole repo on the cluster and hands this step a
        # local path to its ROOT, so TRAIN_DATA_SUBDIR is appended below.
        # Declaring it as an input rather than hardcoding a path is what puts
        # the dataset in `gb build status` and in the lineage record.
        train_data:
          uri: "$${DATA_URI}"
          type: dataset
        # The base weights, bound rather than downloaded by the trainer.
        base_model:
          uri: "$${BASE_MODEL_URI}"
          type: model
      outputs:
        # The adapter directory. The step echoes the LLMB_ARTIFACT_ID marker
        # for `dir_to_save` itself, and `uri` is templated against that event's
        # payload, so {{ binding.path }} is the run-specific directory it wrote.
        # The output KEY must equal byoc_config.output_name: the step declares
        # its output as "{{ config.byoc_config.output_name or target_name }}".
        adapter:
          uri: "env://{{ binding.path }}"
          type: model
      steps:
        - step_uri: space://steps/custom_code_lsf
          config:
            compute_config:
              num_nodes: $${NUM_NODES}
              num_gpus_per_node: $${NUM_GPUS_PER_NODE}
              num_cpus_per_node: $${NUM_CPUS_PER_NODE}
              total_memory_per_node: $${TOTAL_MEMORY_PER_NODE}
            lsf:
              # Only queue and group: this merges with the step's own `lsf`
              # block and leaves its 5 default secret mappings intact. Declaring
              # `secrets` here would REPLACE all five — including the HF_TOKEN
              # mapping the private dataset pull needs — and the validator
              # rejects a block that omits any of them.
              queue: "$${QUEUE}"
              group: "$${LSF_GROUP}"
            byoc_config:
              # The harness: this repo, which carries environment.yml and the
              # two run scripts. The job clones the PUSHED ref, so a local edit
              # to train.sh takes effect only after a push — pin HARNESS_REF to
              # a SHA for anything you intend to compare against later.
              github_url: "$${HARNESS_REPO}"
              github_ref: "$${HARNESS_REF}"
              # This repo's history is large and the clone is per job.
              shallow_clone: true
              conda_lockfile_path: "recipes/granite-switch/lsf/answerability-sr/environment.yml"
              dependency_files:
                - "recipes/granite-switch/lsf/answerability-sr/environment.yml"
              # Not editable (`pip install -e .`) and not from the clone: the
              # step pins the env cache to the (lockfile + this command +
              # dependency_files) hash, and an editable install would tie the
              # cached env to one job's repo path. shadow-residual is installed
              # from its own public repo at SR_REF instead. tensorboard is not
              # one of its dependencies but REPORT_TO defaults to it.
              setup_command: "pip install --no-cache-dir 'shadow-residual[train] @ git+$${SR_REPO}@$${SR_REF}' tensorboard"
              start_command: "bash $REPO_ROOT/recipes/granite-switch/lsf/answerability-sr/train.sh"
              # $OUTPUT_PATH already IS this directory; train.sh writes into it.
              dir_to_save: "adapter"
              output_name: "adapter"
              env:
                # Binding paths. The step's own command template reads the same
                # `bindings` context, and its input declaration documents this
                # as the way to reach inputs beyond the primary one.
                TRAIN_DIR: "{{ bindings.train_data.binding.path }}/$${TRAIN_DATA_SUBDIR}"
                BASE: "{{ bindings.base_model.binding.path }}"
                BASE_MODEL_ID: "$${BASE_MODEL_ID}"
                MAX_LENGTH: "$${MAX_LENGTH}"
                ASSISTANT_MARKER: "$${ASSISTANT_MARKER}"
                LAST_CONTEXT_TOKEN: "$${LAST_CONTEXT_TOKEN}"
                LAST_TOKEN: "$${LAST_TOKEN}"
                LORA_RANK: "$${LORA_RANK}"
                CROSS_STREAM_RANK: "$${CROSS_STREAM_RANK}"
                LORA_ALPHA: "$${LORA_ALPHA}"
                LORA_DROPOUT: "$${LORA_DROPOUT}"
                LEARNING_RATE: "$${LEARNING_RATE}"
                WEIGHT_DECAY: "$${WEIGHT_DECAY}"
                LR_SCHEDULER: "$${LR_SCHEDULER}"
                WARMUP_RATIO: "$${WARMUP_RATIO}"
                PER_DEVICE_TRAIN: "$${PER_DEVICE_TRAIN}"
                GRADIENT_ACCUMULATION: "$${GRADIENT_ACCUMULATION}"
                PER_DEVICE_EVAL: "$${PER_DEVICE_EVAL}"
                GRADIENT_CHECKPOINTING: "$${GRADIENT_CHECKPOINTING}"
                SAVE_TOTAL_LIMIT: "$${SAVE_TOTAL_LIMIT}"
                NUM_EPOCHS: "$${NUM_EPOCHS}"
                SEED: "$${SEED}"
                LOGGING_STEPS: "$${LOGGING_STEPS}"
                DATALOADER_NUM_WORKERS: "$${DATALOADER_NUM_WORKERS}"
                REPORT_TO: "$${REPORT_TO}"
                MAX_STEPS: "$${MAX_STEPS}"

    ##########################################################################
    # eval — score that adapter on the answerability eval set
    ##########################################################################
    eval:
      environment_uri: "$${ENVIRONMENT_URI}"
      inputs:
        # The adapter train produced. Binding it rather than naming a path is
        # what sequences the two targets and records the lineage edge.
        adapter:
          binding: train.adapter
        # The same repo train pulled, so this pull finds the cache warm and
        # transfers nothing; EVAL_DATA_SUBDIR picks the directory inside it.
        eval_data:
          uri: "$${DATA_URI}"
          type: dataset
        base_model:
          uri: "$${BASE_MODEL_URI}"
          type: model
      outputs:
        # result_df.csv (per-row predictions) + eval_summary.{jsonl,md,csv}.
        report:
          uri: "env://{{ binding.path }}"
          type: dataset
      steps:
        - step_uri: space://steps/custom_code_lsf
          config:
            compute_config:
              num_nodes: $${NUM_NODES}
              num_gpus_per_node: $${EVAL_NUM_GPUS_PER_NODE}
              num_cpus_per_node: $${EVAL_NUM_CPUS_PER_NODE}
              total_memory_per_node: $${EVAL_TOTAL_MEMORY_PER_NODE}
            lsf:
              queue: "$${QUEUE}"
              group: "$${LSF_GROUP}"
            byoc_config:
              github_url: "$${HARNESS_REPO}"
              github_ref: "$${HARNESS_REF}"
              shallow_clone: true
              conda_lockfile_path: "recipes/granite-switch/lsf/answerability-sr/environment.yml"
              dependency_files:
                - "recipes/granite-switch/lsf/answerability-sr/environment.yml"
              # Identical to train's, which is the point: same string, same
              # dependency files, same env cache entry — eval reuses the
              # environment train built instead of resolving it again.
              setup_command: "pip install --no-cache-dir 'shadow-residual[train] @ git+$${SR_REPO}@$${SR_REF}' tensorboard"
              start_command: "bash $REPO_ROOT/recipes/granite-switch/lsf/answerability-sr/eval.sh"
              dir_to_save: "report"
              output_name: "report"
              env:
                ADAPTER: "{{ bindings.adapter.binding.path }}"
                EVAL_DIR: "{{ bindings.eval_data.binding.path }}/$${EVAL_DATA_SUBDIR}"
                BASE: "{{ bindings.base_model.binding.path }}"
                EVAL_DATASET_SIZE: "$${EVAL_DATASET_SIZE}"
                EVAL_BATCH_SIZE: "$${EVAL_BATCH_SIZE}"
                EVAL_MAX_NEW_TOKENS: "$${EVAL_MAX_NEW_TOKENS}"
